<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadow Empire | Теневая экономика</title>
    <style>
        /* Ваши существующие стили остаются без изменений */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        :root {
            --primary: #00ff00;
            --secondary: #006600;
            --background: #0a0a0a;
            --card-bg: #001100;
            --text: #00ff00;
            --warning: #ffff00;
            --danger: #ff0000;
            --bank-blue: #0066cc;
            --realty-gold: #ffcc00;
            --auction-purple: #9900ff;
            --cart-orange: #ff9900;
        }
        
        body {
            background-color: var(--background);
            color: var(--text);
            min-height: 100vh;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(0, 255, 0, 0.05) 0%, transparent 20%),
                radial-gradient(circle at 90% 80%, rgba(0, 255, 0, 0.05) 0%, transparent 20%);
            overflow-x: hidden;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        /* Остальные стили остаются без изменений */
        /* ... */
    </style>
</head>
<body>
    <!-- Ваш существующий HTML код -->
    <!-- ... -->

    <script>
        // База данных
        let DB = {
            users: JSON.parse(localStorage.getItem('empire_users')) || [],
            products: JSON.parse(localStorage.getItem('empire_products')) || [],
            realty: JSON.parse(localStorage.getItem('empire_realty')) || [],
            auction: JSON.parse(localStorage.getItem('empire_auction')) || [],
            transactions: JSON.parse(localStorage.getItem('empire_transactions')) || [],
            bids: JSON.parse(localStorage.getItem('empire_bids')) || [],
            orders: JSON.parse(localStorage.getItem('empire_orders')) || [],
            userProperty: JSON.parse(localStorage.getItem('empire_user_property')) || [],
            userProfiles: JSON.parse(localStorage.getItem('empire_user_profiles')) || []
        };

        let currentUser = null;
        let cart = [];

        // Инициализация базы данных
        function initDB() {
            if (DB.users.length === 0) {
                // Создаем тестовых пользователей
                DB.users.push({
                    username: 'owner',
                    password: 'owner123',
                    role: 'owner',
                    balance: 1000000000,
                    registered: new Date().toISOString()
                });
                
                DB.users.push({
                    username: 'tech_admin',
                    password: 'admin123',
                    role: 'tech_admin',
                    balance: 500000000,
                    registered: new Date().toISOString()
                });
                
                DB.users.push({
                    username: 'buyer1',
                    password: '123',
                    role: 'buyer',
                    balance: 5000000,
                    registered: new Date().toISOString()
                });
                
                DB.users.push({
                    username: 'seller1',
                    password: '123',
                    role: 'seller',
                    balance: 10000000,
                    registered: new Date().toISOString()
                });
                
                // Добавляем тестовые товары
                if (DB.products.length === 0) {
                    DB.products.push({
                        id: Date.now(),
                        name: "Премиум кокаин",
                        price: 5000,
                        seller: "seller1",
                        stock: 100,
                        category: "drugs",
                        description: "Высококачественный кокаин из Колумбии"
                    });
                    
                    DB.products.push({
                        id: Date.now() + 1,
                        name: "АК-47",
                        price: 15000,
                        seller: "seller1",
                        stock: 50,
                        category: "weapons",
                        description: "Надежный автомат Калашникова"
                    });
                }
                
                // Добавляем тестовую недвижимость
                if (DB.realty.length === 0) {
                    DB.realty.push({
                        id: Date.now() + 2,
                        name: "Пентхаус в Москва-Сити",
                        price: 50000000,
                        seller: "seller1",
                        type: "houses",
                        description: "Роскошный пентхаус с панорамным видом"
                    });
                    
                    DB.realty.push({
                        id: Date.now() + 3,
                        name: "Ferrari F8 Tributo",
                        price: 25000000,
                        seller: "seller1",
                        type: "cars",
                        description: "Спортивный автомобиль класса люкс"
                    });
                }
                
                saveDB();
            }
        }

        function saveDB() {
            localStorage.setItem('empire_users', JSON.stringify(DB.users));
            localStorage.setItem('empire_products', JSON.stringify(DB.products));
            localStorage.setItem('empire_realty', JSON.stringify(DB.realty));
            localStorage.setItem('empire_auction', JSON.stringify(DB.auction));
            localStorage.setItem('empire_transactions', JSON.stringify(DB.transactions));
            localStorage.setItem('empire_bids', JSON.stringify(DB.bids));
            localStorage.setItem('empire_orders', JSON.stringify(DB.orders));
            localStorage.setItem('empire_user_property', JSON.stringify(DB.userProperty));
            localStorage.setItem('empire_user_profiles', JSON.stringify(DB.userProfiles));
        }

        // Уведомления
        function showNotification(message, type = 'success') {
            const notification = document.getElementById('notification');
            notification.textContent = message;
            notification.className = `notification ${type} show`;
            
            setTimeout(() => {
                notification.classList.remove('show');
            }, 3000);
        }

        // Авторизация
        function login() {
            const username = document.getElementById('login-username').value.trim();
            const password = document.getElementById('login-password').value;
            
            if (!username || !password) {
                showNotification('Заполните все поля', 'error');
                return;
            }
            
            const user = DB.users.find(u => u.username === username && u.password === password);
            
            if (user) {
                currentUser = user;
                document.getElementById('auth-screen').classList.remove('active');
                document.getElementById('main-screen').classList.add('active');
                
                // Загружаем корзину пользователя
                loadCart();
                
                // Обновляем UI
                updateUI();
                
                showNotification('Успешный вход в систему');
            } else {
                showNotification('Неверный логин или пароль', 'error');
            }
        }

        function register() {
            const username = document.getElementById('reg-username').value.trim();
            const password = document.getElementById('reg-password').value;
            const role = document.getElementById('reg-role').value;
            
            if (!username || !password) {
                showNotification('Заполните все поля', 'error');
                return;
            }
            
            if (username.length < 3) {
                showNotification('Логин должен быть не менее 3 символов', 'error');
                return;
            }
            
            if (password.length < 3) {
                showNotification('Пароль должен быть не менее 3 символов', 'error');
                return;
            }
            
            if (DB.users.find(u => u.username === username)) {
                showNotification('Пользователь с таким логином уже существует', 'error');
                return;
            }
            
            const initialBalance = role === 'seller' ? 100000 : 50000;
            
            const newUser = {
                username,
                password,
                role,
                balance: initialBalance,
                registered: new Date().toISOString()
            };
            
            DB.users.push(newUser);
            saveDB();
            showNotification('Аккаунт успешно создан! Теперь вы можете войти в систему.');
            
            // Очистка полей
            document.getElementById('reg-username').value = '';
            document.getElementById('reg-password').value = '';
        }

        function logout() {
            currentUser = null;
            cart = [];
            document.getElementById('auth-screen').classList.add('active');
            document.getElementById('main-screen').classList.remove('active');
            document.getElementById('login-username').value = '';
            document.getElementById('login-password').value = '';
            showNotification('Вы вышли из системы');
        }

        // Навигация
        document.querySelectorAll('.nav-item').forEach(item => {
            item.addEventListener('click', function() {
                const section = this.getAttribute('data-section');
                
                // Обновляем активную кнопку
                document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
                this.classList.add('active');
                
                // Показываем соответствующую секцию
                document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
                document.getElementById(`${section}-section`).classList.add('active');
                
                // Загружаем данные для секции
                if (section === 'seller-orders') {
                    loadSellerOrders();
                } else if (section === 'profile') {
                    loadProfile();
                } else if (section === 'bank') {
                    loadTransactions();
                }
            });
        });

        // Вкладки
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', function() {
                const tabId = this.getAttribute('data-tab');
                const container = this.closest('.tab-container');
                
                // Обновляем активную вкладку
                container.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                this.classList.add('active');
                
                // Показываем соответствующее содержимое
                const contentContainer = this.closest('.section').querySelectorAll('.tab-content');
                contentContainer.forEach(c => c.classList.remove('active'));
                document.getElementById(tabId).classList.add('active');
                
                // Загружаем данные для вкладки
                if (tabId === 'my-houses') {
                    loadUserHouses();
                } else if (tabId === 'my-cars') {
                    loadUserCars();
                } else if (tabId === 'my-business') {
                    loadUserBusiness();
                } else if (tabId === 'my-orders') {
                    loadUserOrders();
                } else if (tabId === 'houses') {
                    loadHouses();
                } else if (tabId === 'cars') {
                    loadCars();
                } else if (tabId === 'business') {
                    loadBusiness();
                } else if (tabId === 'my-realty') {
                    loadMyRealty();
                } else if (tabId === 'my-products') {
                    loadMyProducts();
                } else if (tabId === 'my-lots') {
                    loadMyLots();
                } else if (tabId === 'drugs' || tabId === 'weapons' || tabId === 'other') {
                    loadProductsByCategory(tabId, `${tabId}-container`);
                } else if (tabId === 'auction-live') {
                    loadAuction();
                } else if (tabId === 'my-bids') {
                    loadMyBids();
                }
            });
        });

        // Обновление UI
        function updateUI() {
            if (!currentUser) return;
            
            // Обновляем панель пользователя
            document.getElementById('current-user').textContent = currentUser.username;
            let roleText = '';
            switch(currentUser.role) {
                case 'buyer': roleText = 'Покупатель'; break;
                case 'seller': roleText = 'Продавец'; break;
                case 'tech_admin': roleText = 'Тех. Админ'; break;
                case 'owner': roleText = 'Владелец'; break;
            }
            document.getElementById('current-role').textContent = roleText;
            
            // Обновляем баланс
            document.getElementById('current-balance').textContent = currentUser.balance.toLocaleString();
            document.getElementById('bank-balance').textContent = currentUser.balance.toLocaleString() + ' ₽';
            
            // Обновляем все разделы
            loadTransactions();
            loadRealty();
            loadProducts();
            loadAuction();
            loadCart();
            loadUserProperty();
            
            // Показываем/скрываем элементы в зависимости от роли
            updateRoleBasedUI();
        }

        function updateRoleBasedUI() {
            // Сбрасываем все скрытые элементы
            document.getElementById('admin-controls').classList.add('hidden');
            document.getElementById('seller-realty-tab').classList.add('hidden');
            document.getElementById('seller-darknet-tab').classList.add('hidden');
            document.getElementById('seller-orders-nav').classList.add('hidden');
            document.getElementById('seller-my-realty-tab').classList.add('hidden');
            document.getElementById('seller-my-products-tab').classList.add('hidden');
            document.getElementById('seller-auction-tab').classList.add('hidden');
            document.getElementById('seller-my-lots-tab').classList.add('hidden');
            
            // Показываем элементы в зависимости от роли
            if (currentUser.role === 'owner' || currentUser.role === 'tech_admin') {
                document.getElementById('admin-controls').classList.remove('hidden');
            }
            
            if (currentUser.role === 'seller' || currentUser.role === 'owner' || currentUser.role === 'tech_admin') {
                document.getElementById('seller-realty-tab').classList.remove('hidden');
                document.getElementById('seller-darknet-tab').classList.remove('hidden');
                document.getElementById('seller-orders-nav').classList.remove('hidden');
                document.getElementById('seller-my-realty-tab').classList.remove('hidden');
                document.getElementById('seller-my-products-tab').classList.remove('hidden');
                document.getElementById('seller-auction-tab').classList.remove('hidden');
                document.getElementById('seller-my-lots-tab').classList.remove('hidden');
            }
        }

        // Банковские операции
        function loadTransactions() {
            const container = document.getElementById('transaction-history');
            if (!container) return;
            
            const userTransactions = DB.transactions
                .filter(t => t.user === currentUser.username)
                .sort((a, b) => new Date(b.date) - new Date(a.date))
                .slice(0, 10);
            
            if (userTransactions.length === 0) {
                container.innerHTML = '<div style="text-align: center; color: #666;">Нет операций</div>';
                return;
            }
            
            let html = '';
            userTransactions.forEach(transaction => {
                const sign = transaction.amount > 0 ? '+' : '';
                const color = transaction.amount > 0 ? 'var(--primary)' : 'var(--danger)';
                const date = new Date(transaction.date).toLocaleDateString();
                
                html += `
                    <div style="padding: 8px 0; border-bottom: 1px solid #333;">
                        <div style="display: flex; justify-content: space-between;">
                            <span>${transaction.description}</span>
                            <span style="color: ${color};">${sign}${transaction.amount.toLocaleString()} ₽</span>
                        </div>
                        <div style="font-size: 0.8em; color: #888;">${date}</div>
                    </div>
                `;
            });
            
            container.innerHTML = html;
        }

        function adminAddFunds() {
            if (currentUser.role !== 'owner' && currentUser.role !== 'tech_admin') {
                showNotification('Недостаточно прав', 'error');
                return;
            }
            
            const username = document.getElementById('admin-username').value.trim();
            const amount = parseInt(document.getElementById('admin-amount').value);
            
            if (!username || !amount || amount <= 0) {
                showNotification('Заполните все поля корректно', 'error');
                return;
            }
            
            const user = DB.users.find(u => u.username === username);
            if (!user) {
                showNotification('Пользователь не найден', 'error');
                return;
            }
            
            user.balance += amount;
            
            // Добавляем транзакцию
            DB.transactions.push({
                id: Date.now(),
                user: user.username,
                type: 'admin_deposit',
                amount: amount,
                description: 'Пополнение администратором',
                date: new Date().toISOString()
            });
            
            saveDB();
            updateUI();
            document.getElementById('admin-username').value = '';
            document.getElementById('admin-amount').value = '';
            showNotification(`Баланс пользователя ${username} пополнен на ${amount.toLocaleString()} ₽`);
        }

        function addSelfFunds() {
            if (currentUser.role !== 'owner' && currentUser.role !== 'tech_admin') {
                showNotification('Недостаточно прав', 'error');
                return;
            }
            
            const amount = parseInt(document.getElementById('self-amount').value);
            
            if (!amount || amount <= 0) {
                showNotification('Введите корректную сумму', 'error');
                return;
            }
            
            currentUser.balance += amount;
            
            // Добавляем транзакцию
            DB.transactions.push({
                id: Date.now(),
                user: currentUser.username,
                type: 'self_deposit',
                amount: amount,
                description: 'Самовыдача средств',
                date: new Date().toISOString()
            });
            
            saveDB();
            updateUI();
            document.getElementById('self-amount').value = '';
            showNotification(`Ваш баланс пополнен на ${amount.toLocaleString()} ₽`);
        }

        // Недвижимость - функции для продавцов
        function addRealty() {
            if (currentUser.role !== 'seller' && currentUser.role !== 'owner' && currentUser.role !== 'tech_admin') {
                showNotification('Только продавцы могут выставлять недвижимость', 'error');
                return;
            }
            
            const name = document.getElementById('new-realty-name').value.trim();
            const type = document.getElementById('new-realty-type').value;
            const price = parseInt(document.getElementById('new-realty-price').value);
            const description = document.getElementById('new-realty-desc').value.trim();
            
            if (!name || !price || !description) {
                showNotification('Заполните все поля', 'error');
                return;
            }
            
            if (price < 1 || price > 100000000) {
                showNotification('Цена должна быть от 1 до 100,000,000 ₽', 'error');
                return;
            }
            
            const newRealty = {
                id: Date.now(),
                name,
                price,
                seller: currentUser.username,
                type,
                description
            };
            
            DB.realty.push(newRealty);
            saveDB();
            
            // Очистка формы
            document.getElementById('new-realty-name').value = '';
            document.getElementById('new-realty-price').value = '';
            document.getElementById('new-realty-desc').value = '';
            
            showNotification('Объект недвижимости успешно выставлен на продажу');
        }

        function loadMyRealty() {
            const container = document.getElementById('my-realty-container');
            if (!container) return;
            
            const myRealty = DB.realty.filter(r => r.seller === currentUser.username);
            
            if (myRealty.length === 0) {
                container.innerHTML = '<div class="card" style="text-align: center; color: #666;">🏠 У вас нет объектов недвижимости</div>';
                return;
            }
            
            container.innerHTML = '';
            myRealty.forEach(item => {
                const itemCard = document.createElement('div');
                itemCard.className = 'card realty-theme';
                itemCard.innerHTML = `
                    <div class="card-title">${item.name}</div>
                    <div class="card-price">${item.price.toLocaleString()} ₽</div>
                    <p><strong>Тип:</strong> ${item.type === 'houses' ? '🏘️ Дом' : item.type === 'cars' ? '🚗 Машина' : '🏢 Бизнес'}</p>
                    <p>${item.description}</p>
                    <div class="card-actions">
                        <button class="button button-small" onclick="editRealty(${item.id})">✏️ Редактировать</button>
                        <button class="button button-small button-danger" onclick="deleteRealty(${item.id})">🗑️ Удалить</button>
                    </div>
                `;
                container.appendChild(itemCard);
            });
        }

        function deleteRealty(id) {
            const index = DB.realty.findIndex(r => r.id === id && r.seller === currentUser.username);
            if (index !== -1) {
                DB.realty.splice(index, 1);
                saveDB();
                loadMyRealty();
                showNotification('Объект недвижимости удален');
            }
        }

        // Даркнет - функции для продавцов
        function addProduct() {
            if (currentUser.role !== 'seller' && currentUser.role !== 'owner' && currentUser.role !== 'tech_admin') {
                showNotification('Только продавцы могут добавлять товары', 'error');
                return;
            }
            
            const name = document.getElementById('new-product-name').value.trim();
            const price = parseInt(document.getElementById('new-product-price').value);
            const stock = parseInt(document.getElementById('new-product-stock').value);
            const category = document.getElementById('new-product-category').value;
            const description = document.getElementById('new-product-desc').value.trim();
            
            if (!name || !price || !stock || !description) {
                showNotification('Заполните все поля', 'error');
                return;
            }
            
            if (price < 1 || price > 100000000) {
                showNotification('Цена должна быть от 1 до 100,000,000 ₽', 'error');
                return;
            }
            
            if (stock < 1 || stock > 10000) {
                showNotification('Количество должно быть от 1 до 10,000', 'error');
                return;
            }
            
            const newProduct = {
                id: Date.now(),
                name,
                price,
                seller: currentUser.username,
                stock,
                category,
                description
            };
            
            DB.products.push(newProduct);
            saveDB();
            
            // Очистка формы
            document.getElementById('new-product-name').value = '';
            document.getElementById('new-product-price').value = '';
            document.getElementById('new-product-stock').value = '';
            document.getElementById('new-product-desc').value = '';
            
            showNotification('Товар успешно добавлен в даркнет');
        }

        function loadMyProducts() {
            const container = document.getElementById('my-products-container');
            if (!container) return;
            
            const myProducts = DB.products.filter(p => p.seller === currentUser.username);
            
            if (myProducts.length === 0) {
                container.innerHTML = '<div class="card" style="text-align: center; color: #666;">📦 У вас нет товаров</div>';
                return;
            }
            
            container.innerHTML = '';
            myProducts.forEach(product => {
                const productCard = document.createElement('div');
                productCard.className = 'card';
                productCard.innerHTML = `
                    <div class="card-title">${product.name}</div>
                    <div class="card-price">${product.price.toLocaleString()} ₽</div>
                    <div class="card-stock">В наличии: ${product.stock} шт.</div>
                    <p><strong>Категория:</strong> ${product.category === 'drugs' ? '💊 Наркотики' : product.category === 'weapons' ? '🔫 Оружие' : '📦 Разное'}</p>
                    <p>${product.description}</p>
                    <div class="card-actions">
                        <button class="button button-small" onclick="editProduct(${product.id})">✏️ Редактировать</button>
                        <button class="button button-small button-danger" onclick="deleteProduct(${product.id})">🗑️ Удалить</button>
                    </div>
                `;
                container.appendChild(productCard);
            });
        }

        function deleteProduct(id) {
            const index = DB.products.findIndex(p => p.id === id && p.seller === currentUser.username);
            if (index !== -1) {
                DB.products.splice(index, 1);
                saveDB();
                loadMyProducts();
                showNotification('Товар удален');
            }
        }

        // Аукцион - функции для продавцов
        function addAuctionLot() {
            if (currentUser.role !== 'seller' && currentUser.role !== 'owner' && currentUser.role !== 'tech_admin') {
                showNotification('Только продавцы могут выставлять лоты на аукцион', 'error');
                return;
            }
            
            const name = document.getElementById('new-lot-name').value.trim();
            const category = document.getElementById('new-lot-category').value;
            const price = parseInt(document.getElementById('new-lot-price').value);
            const minBid = parseInt(document.getElementById('new-lot-min-bid').value);
            const duration = parseInt(document.getElementById('new-lot-duration').value);
            const description = document.getElementById('new-lot-desc').value.trim();
            
            if (!name || !price || !minBid || !duration || !description) {
                showNotification('Заполните все поля', 'error');
                return;
            }
            
            if (price < 1 || price > 100000000) {
                showNotification('Цена должна быть от 1 до 100,000,000 ₽', 'error');
                return;
            }
            
            if (minBid < 1 || minBid > 100000000) {
                showNotification('Минимальная ставка должна быть от 1 до 100,000,000 ₽', 'error');
                return;
            }
            
            if (duration < 1 || duration > 720) {
                showNotification('Длительность должна быть от 1 до 720 часов', 'error');
                return;
            }
            
            const newLot = {
                id: Date.now(),
                name,
                seller: currentUser.username,
                category,
                startPrice: price,
                currentPrice: price,
                minBid,
                endTime: new Date(Date.now() + duration * 60 * 60 * 1000).toISOString(),
                description,
                active: true,
                bids: [],
                currentBidder: null
            };
            
            DB.auction.push(newLot);
            saveDB();
            
            // Очистка формы
            document.getElementById('new-lot-name').value = '';
            document.getElementById('new-lot-price').value = '';
            document.getElementById('new-lot-min-bid').value = '';
            document.getElementById('new-lot-duration').value = '';
            document.getElementById('new-lot-desc').value = '';
            
            showNotification('Лот успешно выставлен на аукцион');
        }

        function loadMyLots() {
            const container = document.getElementById('my-lots-container');
            if (!container) return;
            
            const myLots = DB.auction.filter(lot => lot.seller === currentUser.username);
            
            if (myLots.length === 0) {
                container.innerHTML = '<div class="card" style="text-align: center; color: #666;">⚜️ У вас нет лотов на аукционе</div>';
                return;
            }
            
            container.innerHTML = '';
            myLots.forEach(lot => {
                const timeLeft = Math.max(0, Math.floor((new Date(lot.endTime) - new Date()) / (1000 * 60 * 60)));
                const timeLeftMinutes = Math.floor(((new Date(lot.endTime) - new Date()) % (1000 * 60 * 60)) / (1000 * 60));
                const isActive = lot.active && new Date(lot.endTime) > new Date();
                
                const lotCard = document.createElement('div');
                lotCard.className = 'card auction-theme';
                lotCard.innerHTML = `
                    <div class="card-title">${lot.name}</div>
                    <div class="card-price">${lot.currentPrice.toLocaleString()} ₽</div>
                    <p><strong>Категория:</strong> ${lot.category === 'cars' ? '🚗 Автомобили' : 
                                                     lot.category === 'houses' ? '🏘️ Недвижимость' : 
                                                     lot.category === 'business' ? '🏢 Бизнес' : '📦 Другое'}</p>
                    <p><strong>Текущий победитель:</strong> ${lot.currentBidder || 'Нет'}</p>
                    <p><strong>Время до конца:</strong> ${timeLeft}ч ${timeLeftMinutes}м</p>
                    <p><strong>Статус:</strong> ${isActive ? '🟢 Активен' : '🔴 Завершен'}</p>
                    <p>${lot.description}</p>
                    <div class="card-actions">
                        <button class="button button-small button-danger" onclick="deleteAuctionLot(${lot.id})">🗑️ Удалить лот</button>
                    </div>
                `;
                container.appendChild(lotCard);
            });
        }

        function deleteAuctionLot(id) {
            const index = DB.auction.findIndex(lot => lot.id === id && lot.seller === currentUser.username);
            if (index !== -1) {
                DB.auction.splice(index, 1);
                saveDB();
                loadMyLots();
                showNotification('Лот удален с аукциона');
            }
        }

        // Корзина и заказы
        function addToCart(type, id) {
            let item;
            
            if (type === 'product') {
                item = DB.products.find(p => p.id === id);
            } else if (type === 'realty') {
                item = DB.realty.find(r => r.id === id);
            }
            
            if (!item) return;
            
            // Проверяем, есть ли уже такой товар в корзине
            const existingItem = cart.find(cartItem => cartItem.type === type && cartItem.id === id);
            
            if (existingItem) {
                if (type === 'product' && existingItem.quantity >= item.stock) {
                    showNotification('Недостаточно товара в наличии', 'error');
                    return;
                }
                existingItem.quantity += 1;
            } else {
                cart.push({
                    type: type,
                    id: id,
                    name: item.name,
                    price: item.price,
                    seller: item.seller,
                    quantity: 1
                });
            }
            
            saveCart();
            updateCartUI();
            showNotification(`"${item.name}" добавлен в корзину`);
        }

        function saveCart() {
            if (currentUser) {
                localStorage.setItem(`empire_cart_${currentUser.username}`, JSON.stringify(cart));
            }
        }

        function loadCart() {
            if (currentUser) {
                const savedCart = localStorage.getItem(`empire_cart_${currentUser.username}`);
                if (savedCart) {
                    cart = JSON.parse(savedCart);
                }
            }
            updateCartUI();
        }

        function updateCartUI() {
            const container = document.getElementById('cart-items-container');
            const badge = document.getElementById('cart-badge');
            const totalAmount = document.getElementById('cart-total-amount');
            const checkoutBtn = document.getElementById('checkout-btn');
            const clearBtn = document.getElementById('clear-cart-btn');
            
            // Обновляем бейдж
            const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
            badge.textContent = totalItems;
            
            if (cart.length === 0) {
                container.innerHTML = '<div class="card" style="text-align: center; padding: 40px; color: #666;">🛒 Корзина пуста</div>';
                totalAmount.textContent = '0';
                checkoutBtn.disabled = true;
                clearBtn.disabled = true;
                return;
            }
            
            let html = '';
            let total = 0;
            
            cart.forEach(item => {
                const itemTotal = item.price * item.quantity;
                total += itemTotal;
                
                html += `
                    <div class="cart-item">
                        <div class="cart-item-info">
                            <div class="card-title">${item.name}</div>
                            <div class="card-price">${item.price.toLocaleString()} ₽</div>
                            <div class="card-seller">Продавец: ${item.seller}</div>
                        </div>
                        <div class="cart-item-actions">
                            <div class="quantity-control">
                                <button class="quantity-btn" onclick="updateQuantity('${item.type}', ${item.id}, ${item.quantity - 1})">-</button>
                                <input type="number" class="quantity-input" value="${item.quantity}" min="1" 
                                       onchange="updateQuantity('${item.type}', ${item.id}, parseInt(this.value))">
                                <button class="quantity-btn" onclick="updateQuantity('${item.type}', ${item.id}, ${item.quantity + 1})">+</button>
                            </div>
                            <div style="font-weight: bold; margin: 0 15px;">
                                ${itemTotal.toLocaleString()} ₽
                            </div>
                            <button class="button button-small button-danger" onclick="removeFromCart('${item.type}', ${item.id})">🗑️</button>
                        </div>
                    </div>
                `;
            });
            
            container.innerHTML = html;
            totalAmount.textContent = total.toLocaleString();
            checkoutBtn.disabled = false;
            clearBtn.disabled = false;
        }

        function updateQuantity(type, id, newQuantity) {
            if (newQuantity < 1) return;
            
            const item = cart.find(cartItem => cartItem.type === type && cartItem.id === id);
            if (item) {
                // Проверяем доступность товара
                if (type === 'product') {
                    const product = DB.products.find(p => p.id === id);
                    if (newQuantity > product.stock) {
                        showNotification('Недостаточно товара в наличии', 'error');
                        return;
                    }
                }
                
                item.quantity = newQuantity;
                saveCart();
                updateCartUI();
            }
        }

        function removeFromCart(type, id) {
            cart = cart.filter(item => !(item.type === type && item.id === id));
            saveCart();
            updateCartUI();
            showNotification('Товар удален из корзины');
        }

        function clearCart() {
            cart = [];
            saveCart();
            updateCartUI();
            showNotification('Корзина очищена');
        }

        function checkout() {
            if (cart.length === 0) {
                showNotification('Корзина пуста', 'error');
                return;
            }
            
            const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            
            if (total > currentUser.balance) {
                showNotification('Недостаточно средств на балансе', 'error');
                return;
            }
            
            // Создаем заказы для каждого продавца
            const ordersBySeller = {};
            
            cart.forEach(item => {
                if (!ordersBySeller[item.seller]) {
                    ordersBySeller[item.seller] = [];
                }
                ordersBySeller[item.seller].push(item);
            });
            
            // Создаем заказы и обрабатываем транзакции
            Object.keys(ordersBySeller).forEach(seller => {
                const sellerItems = ordersBySeller[seller];
                const orderTotal = sellerItems.reduce((sum, item) => sum + (item.price * item.quantity), 0);
                
                // Создаем заказ
                const order = {
                    id: Date.now(),
                    buyer: currentUser.username,
                    seller: seller,
                    items: sellerItems,
                    total: orderTotal,
                    status: 'pending',
                    date: new Date().toISOString()
                };
                
                DB.orders.push(order);
                
                // Переводим деньги продавцу
                const sellerUser = DB.users.find(u => u.username === seller);
                if (sellerUser) {
                    sellerUser.balance += orderTotal;
                    
                    // Добавляем транзакцию продавцу
                    DB.transactions.push({
                        id: Date.now(),
                        user: seller,
                        type: 'sale',
                        amount: orderTotal,
                        description: `Продажа товаров покупателю ${currentUser.username}`,
                        date: new Date().toISOString()
                    });
                    
                    // Обновляем количество товаров
                    sellerItems.forEach(item => {
                        if (item.type === 'product') {
                            const product = DB.products.find(p => p.id === item.id);
                            if (product) {
                                product.stock -= item.quantity;
                            }
                        } else if (item.type === 'realty') {
                            // Удаляем недвижимость из продажи
                            const index = DB.realty.findIndex(r => r.id === item.id);
                            if (index !== -1) {
                                DB.realty.splice(index, 1);
                            }
                            
                            // Добавляем недвижимость покупателю
                            const realtyItem = DB.realty.find(r => r.id === item.id);
                            if (realtyItem) {
                                DB.userProperty.push({
                                    id: realtyItem.id,
                                    name: realtyItem.name,
                                    type: realtyItem.type,
                                    owner: currentUser.username,
                                    purchaseDate: new Date().toISOString(),
                                    purchasePrice: realtyItem.price
                                });
                            }
                        }
                    });
                }
            });
            
            // Списание средств у покупателя
            currentUser.balance -= total;
            
            // Добавляем транзакцию покупателю
            DB.transactions.push({
                id: Date.now(),
                user: currentUser.username,
                type: 'purchase',
                amount: -total,
                description: 'Покупка товаров в даркнете',
                date: new Date().toISOString()
            });
            
            // Очищаем корзину
            cart = [];
            
            saveDB();
            saveCart();
            updateUI();
            showNotification(`Заказ успешно оформлен! Сумма: ${total.toLocaleString()} ₽`);
        }

        // Загрузка заказов для продавца
        function loadSellerOrders() {
            const container = document.getElementById('seller-orders-container');
            if (!container) return;
            
            const sellerOrders = DB.orders.filter(order => order.seller === currentUser.username);
            
            if (sellerOrders.length === 0) {
                container.innerHTML = '<div class="card" style="text-align: center; color: #666;">📦 У вас нет заказов</div>';
                return;
            }
            
            container.innerHTML = '';
            sellerOrders.forEach(order => {
                const orderCard = document.createElement('div');
                orderCard.className = 'card';
                orderCard.innerHTML = `
                    <div class="card-title">Заказ #${order.id}</div>
                    <div class="card-price">${order.total.toLocaleString()} ₽</div>
                    <p><strong>Покупатель:</strong> ${order.buyer}</p>
                    <p><strong>Статус:</strong> ${order.status === 'pending' ? '⏳ Ожидает' : 
                                                order.status === 'shipped' ? '🚚 Отправлен' : 
                                                order.status === 'delivered' ? '✅ Доставлен' : order.status}</p>
                    <p><strong>Дата:</strong> ${new Date(order.date).toLocaleDateString()}</p>
                    <div class="card-actions">
                        ${order.status === 'pending' ? 
                            `<button class="button button-small" onclick="updateOrderStatus(${order.id}, 'shipped')">🚚 Отправить</button>` : 
                            order.status === 'shipped' ? 
                            `<button class="button button-small" onclick="updateOrderStatus(${order.id}, 'delivered')">✅ Доставлено</button>` : 
                            ''}
                    </div>
                `;
                container.appendChild(orderCard);
            });
        }

        function updateOrderStatus(orderId, status) {
            const order = DB.orders.find(o => o.id === orderId && o.seller === currentUser.username);
            if (order) {
                order.status = status;
                saveDB();
                loadSellerOrders();
                showNotification(`Статус заказа обновлен на "${status}"`);
            }
        }

        // Загрузка профиля
        function loadProfile() {
            const container = document.getElementById('profile-info');
            if (!container) return;
            
            const userProfile = DB.userProfiles.find(p => p.username === currentUser.username) || {
                username: currentUser.username,
                bio: '',
                joinDate: currentUser.registered
            };
            
            const registeredDate = new Date(userProfile.joinDate).toLocaleDateString();
            
            container.innerHTML = `
                <div class="card">
                    <div class="card-title">👤 ${currentUser.username}</div>
                    <p><strong>Роль:</strong> ${currentUser.role === 'buyer' ? 'Покупатель' : 
                                              currentUser.role === 'seller' ? 'Продавец' : 
                                              currentUser.role === 'tech_admin' ? 'Тех. Админ' : 'Владелец'}</p>
                    <p><strong>Баланс:</strong> ${currentUser.balance.toLocaleString()} ₽</p>
                    <p><strong>Дата регистрации:</strong> ${registeredDate}</p>
                    <p><strong>О себе:</strong> ${userProfile.bio || 'Нет информации'}</p>
                    <div class="card-actions">
                        <button class="button" onclick="editProfile()">✏️ Редактировать профиль</button>
                    </div>
                </div>
            `;
        }

        function editProfile() {
            const userProfile = DB.userProfiles.find(p => p.username === currentUser.username) || {
                username: currentUser.username,
                bio: '',
                joinDate: currentUser.registered
            };
            
            const newBio = prompt('Введите информацию о себе:', userProfile.bio);
            if (newBio !== null) {
                userProfile.bio = newBio;
                if (!DB.userProfiles.find(p => p.username === currentUser.username)) {
                    DB.userProfiles.push(userProfile);
                }
                saveDB();
                loadProfile();
                showNotification('Профиль обновлен');
            }
        }

        // Инициализация при загрузке
        document.addEventListener('DOMContentLoaded', function() {
            initDB();
            
            // Проверяем, есть ли активный пользователь
            const savedUser = localStorage.getItem('empire_current_user');
            if (savedUser) {
                const user = JSON.parse(savedUser);
                const dbUser = DB.users.find(u => u.username === user.username && u.password === user.password);
                if (dbUser) {
                    currentUser = dbUser;
                    document.getElementById('auth-screen').classList.remove('active');
                    document.getElementById('main-screen').classList.add('active');
                    loadCart();
                    updateUI();
                }
            }
            
            // Сохраняем текущего пользователя при выходе
            window.addEventListener('beforeunload', function() {
                if (currentUser) {
                    localStorage.setItem('empire_current_user', JSON.stringify({
                        username: currentUser.username,
                        password: currentUser.password
                    }));
                }
            });
        });

        // Остальные функции остаются без изменений
        // ...
    </script>
</body>
</html>
